spring.application.name=dentalcare
server.port=8080

springdotenv.directory=../
springdotenv.filename=.env
springdotenv.ignoreIfMissing=true

# PostgreSQL connection (same credential keys as docker-compose.yml — single source of truth in ../.env)
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA / Hibernate
# none=prod / update=dev
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# LOGGING
logging.level.root=INFO
#logging.level.smart.finance=DEBUG
#logging.level.org.springframework=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) %cyan(%logger{36}) - %msg%n

# RATE LIMIT (bucket4j, in-memory, per client IP)
rate-limit.enabled=true
# general endpoints: burst of 60, refilled 60/min
rate-limit.api.capacity=60
rate-limit.api.refill-tokens=60
rate-limit.api.refill-seconds=60
# /api/auth/* (brute-force protection): burst of 5, refilled 5/min
rate-limit.login.capacity=5
rate-limit.login.refill-tokens=5
rate-limit.login.refill-seconds=60

# Security Configuration
jwt.secret=${JWT_SECRET}
jwt.access-expiration=28800000
jwt.refresh-expiration=604800000
